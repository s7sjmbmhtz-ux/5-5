<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>5х5</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#0b1220;color:#fff;font:16px sans-serif;padding:10px;max-width:480px;margin:auto}
.card{background:#111a2d;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #293858}
input,select,textarea{width:100%;background:#0c1426;color:#fff;border:1px solid #30405f;border-radius:8px;padding:10px;font-size:16px;margin:4px 0;box-sizing:border-box}
button{background:#5b8cff;color:#fff;border:0;border-radius:8px;padding:12px;font-size:16px;font-weight:bold;width:100%;cursor:pointer;margin:4px 0}
button.danger{background:#71333d}
button.small{font-size:12px;padding:4px 10px;width:auto;margin:2px}
.hidden{display:none}
table{width:100%;font-size:13px;border-collapse:collapse}
th,td{padding:6px;border-bottom:1px solid #293858;text-align:left}
.badge{background:#22304c;padding:3px 8px;border-radius:99px;font-size:11px}
.gold{background:#3a3119;color:#f4c451}
.nav{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.nav button{flex:0 0 auto;background:#121c31;color:#fff;border:1px solid #293858;border-radius:8px;padding:8px 14px;font-size:13px;width:auto;cursor:pointer}
.nav button.active{background:#5b8cff;border:0}
.toast{position:fixed;bottom:20px;left:20px;right:20px;background:#18243d;padding:12px;border-radius:10px;display:none;z-index:999}
.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#263452;display:block;margin-bottom:4px}
</style>
</head>
<body>

<div id="app">
  <h1>🏀 5х5</h1>
  <div class="muted">Мастерство не пропьёшь!</div>
  
  <div class="nav" id="nav"></div>
  
  <!-- ДОБАВИТЬ ТРЕНИРОВКУ -->
  <div id="input" class="page">
    <div class="card">
      <h3>Добавить тренировку</h3>
      <form id="form">
        <input id="date" type="date" required>
        <select id="bestSelect"><option>Загрузка...</option></select>
        <select id="helperSelect"><option>Загрузка...</option></select>
        <textarea id="comment" placeholder="Комментарий"></textarea>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <input id="white" type="number" placeholder="Белые" value="0">
          <input id="blue" type="number" placeholder="Синие" value="0">
        </div>
        <button type="submit">Добавить</button>
      </form>
    </div>
    <div class="card"><h3>Последние</h3><div id="recent"></div></div>
  </div>

  <!-- ТРЕНИРОВКИ -->
  <div id="training" class="page hidden">
    <div class="card"><h3>Все тренировки</h3><div id="trainings"></div></div>
  </div>

  <!-- СТАТИСТИКА -->
  <div id="stats" class="page hidden">
    <div class="card"><h3>Статистика</h3><div id="statTable"></div></div>
  </div>

  <!-- СОСТАВ -->
  <div id="players" class="page hidden">
    <div class="card">
      <h3>Состав</h3>
      <div id="roster" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
    </div>
  </div>

  <!-- МЕДИА -->
  <div id="media" class="page hidden">
    <div class="card">
      <h3>Добавить медиа</h3>
      <form id="mediaForm">
        <input id="mediaFile" type="file" accept="image/*,video/*" required>
        <input id="mediaCaption" placeholder="Подпись">
        <button type="submit">Опубликовать</button>
      </form>
      <div id="mediaGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"></div>
    </div>
  </div>

  <!-- ТУРНИРЫ -->
  <div id="tournaments" class="page hidden">
    <div class="card">
      <h3>Добавить турнир</h3>
      <form id="tourForm">
        <input id="tn" placeholder="Название турнира" required>
        <input id="td" type="date" required>
        <input id="to" placeholder="Соперник">
        <input id="ts" placeholder="Счёт (например, 65:58)">
        <button type="submit">Добавить турнир</button>
      </form>
      <div id="tourTable" style="margin-top:10px"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ============================================================
// 1. ПОДКЛЮЧЕНИЕ К SUPABASE
// ============================================================
const SUPABASE_URL = 'https://sihixudkoxmksxgziary.supabase.co';
const SUPABASE_KEY = 'sb_publishable_LKWMnwcogf1c-hGQyjKuZg_LuHl9LR8';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ============================================================
// 2. ДАННЫЕ
// ============================================================
let players = [];
let trainings = [];
let tournaments = [];
let media = [];

// ============================================================
// 3. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
// ============================================================
const $ = id => document.getElementById(id);
const msg = t => { const a = $('toast'); a.textContent = t; a.style.display = 'block'; setTimeout(() => a.style.display = 'none', 3000); };
const fmt = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('ru-RU') : '—';

// ============================================================
// 4. НАВИГАЦИЯ
// ============================================================
function nav() {
  const items = [
    ['input', 'Добавить'],
    ['training', 'Тренировки'],
    ['stats', 'Статистика'],
    ['players', 'Состав'],
    ['media', 'Медиа'],
    ['tournaments', 'Турниры']
  ];
  $('nav').innerHTML = items.map(([id, name], i) => 
    `<button class="${i === 0 ? 'active' : ''}" data-p="${id}">${name}</button>`
  ).join('');
  document.querySelectorAll('.nav button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.nav button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
      $(b.dataset.p).classList.remove('hidden');
    };
  });
}

// ============================================================
// 5. ЗАГРУЗКА ДАННЫХ
// ============================================================
async function load() {
  try {
    // Игроки
    const pr = await sb.from('players').select('*').order('number');
    if (pr.error) throw new Error(pr.error.message);
    players = pr.data || [];
    
    // Тренировки
    const tr = await sb.from('trainings').select(`
      *,
      best:players!best_player_id(name),
      helper:players!helper_player_id(name)
    `).order('date', { ascending: false });
    if (tr.error) throw new Error(tr.error.message);
    trainings = tr.data || [];
    trainings.forEach(t => {
      t.best_name = t.best?.name || null;
      t.helper_name = t.helper?.name || null;
    });
    
    // Турниры
    const to = await sb.from('tournaments').select(`
      *,
      mvp:players!mvp_player_id(name)
    `).order('date', { ascending: false });
    if (to.error) throw new Error(to.error.message);
    tournaments = to.data || [];
    tournaments.forEach(t => {
      t.mvp_name = t.mvp?.name || null;
    });
    
    // Медиа
    const md = await sb.from('media').select('*').order('created_at', { ascending: false });
    if (md.error) throw new Error(md.error.message);
    media = md.data || [];
    
  } catch (err) {
    msg('⚠️ Ошибка загрузки: ' + err.message);
  }
  
  fillPlayerSelects();
  render();
  renderRoster();
  renderMedia();
  renderTours();
}

function fillPlayerSelects() {
  const opts = players.map(p => `<option value="${p.id}">№${p.number} — ${p.name}</option>`).join('');
  $('bestSelect').innerHTML = '<option value="">Выберите</option>' + opts;
  $('helperSelect').innerHTML = '<option value="">Выберите</option>' + opts;
}

// ============================================================
// 6. ДОБАВЛЕНИЕ ТРЕНИРОВКИ
// ============================================================
$('form').onsubmit = async e => {
  e.preventDefault();
  
  const best = $('bestSelect').value;
  const helper = $('helperSelect').value;
  if (!best || !helper) { msg('Выберите игроков'); return; }
  
  const payload = {
    date: $('date').value,
    best_player_id: best,
    helper_player_id: helper,
    white_score: Number($('white').value) || 0,
    blue_score: Number($('blue').value) || 0,
    comment: $('comment').value || ''
  };
  
  const result = await sb.from('trainings').insert(payload);
  if (result.error) {
    msg('❌ Ошибка: ' + result.error.message);
    return;
  }
  
  msg('✅ Тренировка добавлена');
  $('form').reset();
  await load();
};

// ============================================================
// 7. УДАЛЕНИЕ ТРЕНИРОВКИ
// ============================================================
async function delTraining(id) {
  if (!confirm('Удалить тренировку?')) return;
  const result = await sb.from('trainings').delete().eq('id', id);
  if (result.error) {
    msg('❌ Ошибка: ' + result.error.message);
    return;
  }
  msg('Удалено');
  await load();
}

// ============================================================
// 8. РЕДАКТИРОВАНИЕ ИГРОКА (рост/вес + ФОТО)
// ============================================================
async function editPlayer(id) {
  const p = players.find(x => x.id === id);
  if (!p) return;
  
  // Сначала рост и вес
  const h = prompt('Рост, см (оставьте пустым, чтобы удалить)', p.height_cm ?? '');
  if (h === null) return;
  const w = prompt('Вес, кг (оставьте пустым, чтобы удалить)', p.weight_kg ?? '');
  if (w === null) return;
  
  await sb.from('players')
    .update({
      height_cm: h.trim() === '' ? null : Number(h),
      weight_kg: w.trim() === '' ? null : Number(w)
    })
    .eq('id', id);
  
  // Потом фото
  if (!confirm('Изменить фото игрока?')) {
    await load();
    return;
  }
  
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async () => {
    if (!input.files[0]) { await load(); return; }
    
    const file = input.files[0];
    const path = 'players/' + id + '_' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    
    const upload = await sb.storage.from('player-photos').upload(path, file);
    if (upload.error) {
      msg('❌ Ошибка фото: ' + upload.error.message);
      await load();
      return;
    }
    
    const photo = sb.storage.from('player-photos').getPublicUrl(path).data.publicUrl;
    await sb.from('players').update({ photo_url: photo }).eq('id', id);
    
    msg('✅ Профиль обновлён');
    await load();
  };
  input.click();
}

// ============================================================
// 9. ДОБАВЛЕНИЕ МЕДИА
// ============================================================
$('mediaForm').onsubmit = async e => {
  e.preventDefault();
  
  const fileInput = $('mediaFile');
  const caption = $('mediaCaption').value || '';
  
  if (!fileInput.files || !fileInput.files[0]) {
    msg('Выберите файл');
    return;
  }
  
  const file = fileInput.files[0];
  const path = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  
  const upload = await sb.storage.from('club-media').upload(path, file);
  if (upload.error) {
    msg('❌ Ошибка загрузки: ' + upload.error.message);
    return;
  }
  
  const url = sb.storage.from('club-media').getPublicUrl(path).data.publicUrl;
  
  const insert = await sb.from('media').insert({
    url: url,
    caption: caption,
    type: file.type.startsWith('video') ? 'video' : 'image'
  });
  
  if (insert.error) {
    msg('❌ Ошибка: ' + insert.error.message);
    return;
  }
  
  msg('✅ Медиа добавлено');
  $('mediaForm').reset();
  await load();
};

// ============================================================
// 10. ДОБАВЛЕНИЕ ТУРНИРА
// ============================================================
$('tourForm').onsubmit = async e => {
  e.preventDefault();
  
  const name = $('tn').value.trim();
  const date = $('td').value;
  const opponent = $('to').value.trim();
  const score = $('ts').value.trim();
  
  if (!name || !date) { msg('Заполните название и дату'); return; }
  
  const result = await sb.from('tournaments').insert({
    name, date, opponent, score
  });
  
  if (result.error) {
    msg('❌ Ошибка: ' + result.error.message);
    return;
  }
  
  msg('✅ Турнир добавлен');
  $('tourForm').reset();
  await load();
};

// ============================================================
// 11. НАЗНАЧЕНИЕ MVP
// ============================================================
async function setMVP(id) {
  const list = players.map(p => `№${p.number} — ${p.name}`).join('\n');
  const number = prompt('Введите номер MVP:\n\n' + list);
  if (number === null) return;
  
  const player = players.find(p => String(p.number) === String(number).trim());
  if (!player) {
    msg('Игрок с таким номером не найден');
    return;
  }
  
  const result = await sb.from('tournaments')
    .update({ mvp_player_id: player.id })
    .eq('id', id);
  
  if (result.error) {
    msg('❌ Ошибка: ' + result.error.message);
    return;
  }
  
  msg('✅ MVP назначен');
  await load();
}

// ============================================================
// 12. РЕНДЕРИНГ
// ============================================================
function render() {
  // Последние тренировки
  $('recent').innerHTML = trainings.length 
    ? `<table><tr><th>Дата</th><th>Лучший</th><th>Счёт</th></tr>${trainings.slice(0,6).map(t => `<tr><td>${fmt(t.date)}</td><td>${t.best_name || '—'}</td><td>${t.white_score}:${t.blue_score}</td></tr>`).join('')}</table>` 
    : 'Нет тренировок';
  
  // Все тренировки
  $('trainings').innerHTML = trainings.length 
    ? `<table><tr><th>Дата</th><th>Лучший</th><th>Помощник</th><th>Счёт</th><th>Победитель</th><th>Комментарий</th><th>Действия</th></tr>${trainings.map(t => `<tr><td>${fmt(t.date)}</td><td>${t.best_name || '—'}</td><td>${t.helper_name || '—'}</td><td>${t.white_score}:${t.blue_score}</td><td><span class="badge">${t.white_score > t.blue_score ? 'Белые' : t.blue_score > t.white_score ? 'Синие' : 'Ничья'}</span></td><td>${t.comment || '—'}</td><td><button class="small" onclick="delTraining('${t.id}')">✕</button></td></tr>`).join('')}</table>` 
    : 'Нет тренировок';
  
  // ==========================================================
  // СТАТИСТИКА: ЛУЧШИЙ, ПОМОЩНИК, СЧАСТЛИВЧИК (без суммы)
  // ==========================================================
  const stats = players.map(p => {
    const bestCount = trainings.filter(t => t.best_player_id === p.id).length;
    const helperCount = trainings.filter(t => t.helper_player_id === p.id).length;
    const luckyCount = trainings.filter(t => t.best_player_id === p.id && t.helper_player_id === p.id).length;
    return { ...p, bestCount, helperCount, luckyCount };
  }).sort((a, b) => (b.bestCount + b.helperCount + b.luckyCount) - (a.bestCount + a.helperCount + a.luckyCount));
  
  $('statTable').innerHTML = `
    <table>
      <tr>
        <th>№</th>
        <th>Игрок</th>
        <th>⭐ Лучший</th>
        <th>🤝 Помощник</th>
        <th>🍀 Счастливчик</th>
      </tr>
      ${stats.map(p => `
        <tr>
          <td>${p.number}</td>
          <td>${p.name}</td>
          <td><b>${p.bestCount}</b></td>
          <td><b>${p.helperCount}</b></td>
          <td>${p.luckyCount ? `<span class="badge gold">🍀 ${p.luckyCount}</span>` : '0'}</td>
        </tr>
      `).join('')}
    </table>
  `;
}

function renderRoster() {
  $('roster').innerHTML = players.map(p => `
    <div style="background:#0c1426;padding:8px;border-radius:8px;border:1px solid #293858">
      <img class="avatar" src="${p.photo_url || ''}" onerror="this.style.display='none'">
      <div><b>№${p.number}</b> ${p.name}</div>
      <div style="font-size:12px;color:#9eabc2;margin:4px 0">
        Рост: ${p.height_cm ? p.height_cm + ' см' : '—'} | Вес: ${p.weight_kg ? p.weight_kg + ' кг' : '—'}
      </div>
      <button class="small" onclick="editPlayer('${p.id}')">✎ Изменить</button>
    </div>
  `).join('');
}

function renderMedia() {
  $('mediaGrid').innerHTML = media.length 
    ? media.map(m => m.type === 'video' 
      ? `<video src="${m.url}" controls style="width:100%;border-radius:8px;aspect-ratio:1;object-fit:cover;"></video>` 
      : `<img src="${m.url}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;" alt="${m.caption || 'Фото'}">`
    ).join('') 
    : 'Нет медиа';
}

function renderTours() {
  $('tourTable').innerHTML = tournaments.length 
    ? `<table><tr><th>Название</th><th>Дата</th><th>Соперник</th><th>Счёт</th><th>MVP</th><th>Действия</th></tr>${tournaments.map(t => `<tr><td>${t.name}</td><td>${fmt(t.date)}</td><td>${t.opponent || '—'}</td><td>${t.score || '—'}</td><td>${t.mvp_name || '—'}</td><td><button class="small" onclick="setMVP('${t.id}')">${t.mvp_name ? '✎ MVP' : '+'}</button></td></tr>`).join('')}</table>` 
    : 'Нет турниров';
}

// ============================================================
// 13. ЗАПУСК
// ============================================================
nav();
$('date').value = new Date().toISOString().slice(0, 10);
$('td').value = new Date().toISOString().slice(0, 10);
load();
</script>
</body>
</html>
