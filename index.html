<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>5х5</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ===== ПЕРЕМЕННЫЕ ===== */
:root {
  --bg: #0b1220;
  --card: #111a2d;
  --card2: #1a2640;
  --border: #293858;
  --text: #f5f7fb;
  --muted: #9eabc2;
  --input: #0c1426;
  --input-border: #30405f;
  --btn-bg: #5b8cff;
  --btn-text: #fff;
  --shadow: rgba(0,0,0,0.4);
  --font-size: 16px;
  --btn-size: 16px;
  --padding: 10px;
  --gap: 8px;
}

[data-theme="light"] {
  --bg: #f0f4fa;
  --card: #ffffff;
  --card2: #f8faff;
  --border: #d0d9e8;
  --text: #1a2332;
  --muted: #5a6a82;
  --input: #ffffff;
  --input-border: #c0c8d8;
  --shadow: rgba(0,0,0,0.08);
}

/* ===== РЕЖИМ ДЛЯ СЛАБОВИДЯЩИХ ===== */
[data-accessibility="on"] {
  --font-size: 20px;
  --btn-size: 20px;
  --padding: 14px;
  --gap: 12px;
}

[data-accessibility="on"] body {
  font-size: 20px;
  line-height: 1.6;
}

[data-accessibility="on"] button,
[data-accessibility="on"] input,
[data-accessibility="on"] select,
[data-accessibility="on"] textarea {
  font-size: 20px !important;
  padding: 14px !important;
  min-height: 54px !important;
}

[data-accessibility="on"] .nav button {
  font-size: 18px !important;
  padding: 12px 18px !important;
}

[data-accessibility="on"] table {
  font-size: 18px !important;
}

[data-accessibility="on"] .badge {
  font-size: 16px !important;
  padding: 6px 12px !important;
}

[data-accessibility="on"] .card {
  padding: 20px !important;
  margin-bottom: 16px !important;
}

[data-accessibility="on"] .avatar {
  width: 72px !important;
  height: 72px !important;
}

[data-accessibility="on"] .small {
  font-size: 17px !important;
  padding: 8px 14px !important;
}

[data-accessibility="on"] th, 
[data-accessibility="on"] td {
  padding: 12px 10px !important;
}

/* ===== ОБЩИЕ СТИЛИ ===== */
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-size: var(--font-size);
  font-family: sans-serif;
  padding: 10px;
  max-width: 100%;
  margin: auto;
  transition: background 0.25s, color 0.25s, font-size 0.2s;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: var(--padding);
  margin-bottom: var(--gap);
  transition: background 0.25s, border 0.25s;
  overflow: hidden;
}
input, select, textarea {
  width: 100%;
  background: var(--input);
  color: var(--text);
  border: 1px solid var(--input-border);
  border-radius: 8px;
  padding: var(--padding);
  font-size: var(--font-size);
  margin: 4px 0;
  box-sizing: border-box;
  transition: background 0.25s, color 0.25s, border 0.25s;
  min-width: 0;
  display: block;
}
input[type="date"] {
  max-width: 100%;
  min-width: 0;
  width: 100%;
  box-sizing: border-box;
  -webkit-appearance: none;
  appearance: none;
}
input[type="number"] {
  width: 100%;
}
button {
  background: var(--btn-bg);
  color: var(--btn-text);
  border: 0;
  border-radius: 8px;
  padding: var(--padding);
  font-size: var(--btn-size);
  font-weight: bold;
  width: 100%;
  cursor: pointer;
  margin: 4px 0;
  transition: opacity 0.2s;
}
button:hover { opacity: 0.85; }
button.small {
  font-size: calc(var(--btn-size) - 2px);
  padding: calc(var(--padding) - 2px) 10px;
  width: auto;
  margin: 2px;
}
button.danger { background: #71333d; }
.hidden { display: none; }

/* ===== ТАБЛИЦЫ НА ВСЮ ШИРИНУ ===== */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin: 0 -4px;
  padding: 0 4px;
}
table {
  width: 100%;
  min-width: 100%;
  font-size: calc(var(--font-size) - 2px);
  border-collapse: collapse;
}
th, td {
  padding: 6px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  white-space: nowrap;
}
th { color: var(--muted); font-weight: 600; }
.badge {
  background: #22304c;
  padding: 3px 8px;
  border-radius: 99px;
  font-size: calc(var(--font-size) - 4px);
}
.gold {
  background: #3a3119;
  color: #f4c451;
}
.nav {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 4px 0;
}
.nav button {
  flex: 0 0 auto;
  background: var(--card2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: var(--padding);
  font-size: calc(var(--btn-size) - 2px);
  width: auto;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.nav button.active {
  background: var(--btn-bg);
  color: #fff;
  border: 0;
}
.toast {
  position: fixed;
  bottom: 20px;
  left: 20px;
  right: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  padding: var(--padding);
  border-radius: 10px;
  display: none;
  z-index: 999;
  color: var(--text);
  box-shadow: 0 4px 20px var(--shadow);
  font-size: var(--font-size);
}
.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  background: #263452;
  display: block;
  margin-bottom: 4px;
}

/* ===== ПЕРЕКЛЮЧАТЕЛИ ===== */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.controls {
  display: flex;
  align-items: center;
  gap: 12px;
}
.controls label {
  font-size: 14px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 4px;
}
.switch {
  position: relative;
  display: inline-block;
  width: 44px;
  height: 24px;
}
.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}
.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: #3a4a6a;
  border-radius: 24px;
  transition: 0.3s;
}
.slider::before {
  content: "";
  position: absolute;
  height: 18px;
  width: 18px;
  left: 3px;
  bottom: 3px;
  background: #fff;
  border-radius: 50%;
  transition: 0.3s;
}
.switch input:checked + .slider {
  background: var(--btn-bg);
}
.switch input:checked + .slider::before {
  transform: translateX(20px);
}
.accessibility-toggle {
  font-size: 22px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 8px;
  background: var(--card2);
  border: 1px solid var(--border);
  transition: 0.2s;
}
.accessibility-toggle:hover {
  opacity: 0.7;
}
.accessibility-toggle.active {
  background: var(--btn-bg);
  border-color: var(--btn-bg);
}

/* ===== ФОРМА ===== */
.form-group {
  margin-bottom: 8px;
}
.form-group label {
  font-weight: 600;
  color: var(--muted);
  font-size: 0.9em;
  display: block;
  margin-bottom: 2px;
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
</style>
</head>
<body>

<div id="app">
  <!-- ШАПКА + УПРАВЛЕНИЕ -->
  <div class="top-bar">
    <h1 style="margin:0;">🏀 5х5</h1>
    <div class="controls">
      <span id="accessibilityIcon" class="accessibility-toggle" title="Режим для слабовидящих">👁️</span>
      <span id="themeIcon">🌙</span>
      <label class="switch">
        <input type="checkbox" id="themeCheckbox">
        <span class="slider"></span>
      </label>
    </div>
  </div>
  <div class="muted" style="margin-top:-6px;margin-bottom:12px;">Мастерство не пропьёшь!</div>
  
  <div class="nav" id="nav"></div>
  
  <!-- ДОБАВИТЬ ТРЕНИРОВКУ -->
  <div id="input" class="page">
    <div class="card">
      <h3>Добавить тренировку</h3>
      <form id="form">
        <div class="form-group">
          <label for="date">Дата</label>
          <input id="date" type="date" required>
        </div>
        
        <div class="form-group">
          <label for="bestSelect">Лучший</label>
          <select id="bestSelect"><option>Загрузка...</option></select>
        </div>
        
        <div class="form-group">
          <label for="helperSelect">Помощник</label>
          <select id="helperSelect"><option>Загрузка...</option></select>
        </div>
        
        <div class="form-group">
          <label for="comment">Комментарий</label>
          <textarea id="comment" placeholder="Комментарий"></textarea>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="white">Белые</label>
            <input id="white" type="number" placeholder="Белые" value="0">
          </div>
          <div class="form-group">
            <label for="blue">Синие</label>
            <input id="blue" type="number" placeholder="Синие" value="0">
          </div>
        </div>
        
        <button type="submit">Добавить</button>
      </form>
    </div>
    <div class="card"><h3>Последние</h3><div id="recent"></div></div>
  </div>

  <!-- ТРЕНИРОВКИ -->
  <div id="training" class="page hidden">
    <div class="card"><h3>Все тренировки</h3><div id="trainings"></div></div>
  </div>

  <!-- СТАТИСТИКА -->
  <div id="stats" class="page hidden">
    <div class="card"><h3>Статистика</h3><div id="statTable"></div></div>
  </div>

  <!-- СОСТАВ -->
  <div id="players" class="page hidden">
    <div class="card">
      <h3>Состав</h3>
      <div id="roster" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
    </div>
  </div>

  <!-- МЕДИА -->
  <div id="media" class="page hidden">
    <div class="card">
      <h3>Добавить медиа</h3>
      <form id="mediaForm">
        <input id="mediaFile" type="file" accept="image/*,video/*" required>
        <input id="mediaCaption" placeholder="Подпись">
        <button type="submit">Опубликовать</button>
      </form>
      <div id="mediaGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"></div>
    </div>
  </div>

  <!-- ТУРНИРЫ -->
  <div id="tournaments" class="page hidden">
    <div class="card">
      <h3>Добавить турнир</h3>
      <form id="tourForm">
        <input id="tn" placeholder="Название турнира" required>
        <input id="td" type="date" required>
        <input id="to" placeholder="Соперник">
        <input id="ts" placeholder="Счёт (например, 65:58)">
        <button type="submit">Добавить турнир</button>
      </form>
      <div id="tourTable" style="margin-top:10px"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ============================================================
// 1. ПОДКЛЮЧЕНИЕ К SUPABASE
// ============================================================
const SUPABASE_URL = 'https://sihixudkoxmksxgziary.supabase.co';
const SUPABASE_KEY = 'sb_publishable_LKWMnwcogf1c-hGQyjKuZg_LuHl9LR8';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ============================================================
// 2. ТЕМА + РЕЖИМ ДЛЯ СЛАБОВИДЯЩИХ
// ============================================================
function loadTheme() {
  const saved = localStorage.getItem('5x5-theme');
  const isDark = saved === null ? true : saved === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  document.getElementById('themeCheckbox').checked = !isDark;
  document.getElementById('themeIcon').textContent = isDark ? '🌙' : '☀️';
}

function toggleTheme() {
  const checkbox = document.getElementById('themeCheckbox');
  const isDark = !checkbox.checked;
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  document.getElementById('themeIcon').textContent = isDark ? '🌙' : '☀️';
  localStorage.setItem('5x5-theme', isDark ? 'dark' : 'light');
}

function loadAccessibility() {
  const saved = localStorage.getItem('5x5-accessibility');
  const isOn = saved === 'on';
  document.documentElement.setAttribute('data-accessibility', isOn ? 'on' : 'off');
  document.getElementById('accessibilityIcon').classList.toggle('active', isOn);
}

function toggleAccessibility() {
  const el = document.getElementById('accessibilityIcon');
  const isOn = el.classList.toggle('active');
  document.documentElement.setAttribute('data-accessibility', isOn ? 'on' : 'off');
  localStorage.setItem('5x5-accessibility', isOn ? 'on' : 'off');
}

document.getElementById('themeCheckbox').addEventListener('change', toggleTheme);
document.getElementById('accessibilityIcon').addEventListener('click', toggleAccessibility);

loadTheme();
loadAccessibility();

// ============================================================
// 3. ДАННЫЕ
// ============================================================
let players = [];
let trainings = [];
let tournaments = [];
let media = [];

const $ = id => document.getElementById(id);
const msg = t => {
  const a = $('toast');
  a.textContent = t;
  a.style.display = 'block';
  setTimeout(() => a.style.display = 'none', 3000);
};
const fmt = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('ru-RU') : '—';

// ============================================================
// 4. НАВИГАЦИЯ
// ============================================================
function nav() {
  const items = [
    ['input', 'Добавить'],
    ['training', 'Тренировки'],
    ['stats', 'Статистика'],
    ['players', 'Состав'],
    ['media', 'Медиа'],
    ['tournaments', 'Турниры']
  ];
  $('nav').innerHTML = items.map(([id, name], i) =>
    `<button class="${i === 0 ? 'active' : ''}" data-p="${id}">${name}</button>`
  ).join('');
  document.querySelectorAll('.nav button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.nav button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
      $(b.dataset.p).classList.remove('hidden');
    };
  });
}

// ============================================================
// 5. ЗАГРУЗКА ДАННЫХ
// ============================================================
async function load() {
  try {
    const pr = await sb.from('players').select('*').order('number');
    if (pr.error) throw new Error(pr.error.message);
    players = pr.data || [];

    const tr = await sb.from('trainings').select(`
      *,
      best:players!best_player_id(name),
      helper:players!helper_player_id(name)
    `).order('date', { ascending: false });
    if (tr.error) throw new Error(tr.error.message);
    trainings = tr.data || [];
    trainings.forEach(t => {
      t.best_name = t.best?.name || null;
      t.helper_name = t.helper?.name || null;
    });

    const to = await sb.from('tournaments').select(`
      *,
      mvp:players!mvp_player_id(name)
    `).order('date', { ascending: false });
    if (to.error) throw new Error(to.error.message);
    tournaments = to.data || [];
    tournaments.forEach(t => {
      t.mvp_name = t.mvp?.name || null;
    });

    const md = await sb.from('media').select('*').order('created_at', { ascending: false });
    if (md.error) throw new Error(md.error.message);
    media = md.data || [];

  } catch (err) {
    msg('⚠️ ' + err.message);
  }
  fillPlayerSelects();
  render();
  renderRoster();
  renderMedia();
  renderTours();
}

function fillPlayerSelects() {
  const opts = players.map(p => `<option value="${p.id}">№${p.number} — ${p.name}</option>`).join('');
  $('bestSelect').innerHTML = '<option value="">Выберите</option>' + opts;
  $('helperSelect').innerHTML = '<option value="">Выберите</option>' + opts;
}

// ============================================================
// 6. ДОБАВЛЕНИЕ ТРЕНИРОВКИ
// ============================================================
$('form').onsubmit = async e => {
  e.preventDefault();
  const best = $('bestSelect').value;
  const helper = $('helperSelect').value;
  if (!best || !helper) { msg('Выберите игроков'); return; }
  const payload = {
    date: $('date').value,
    best_player_id: best,
    helper_player_id: helper,
    white_score: Number($('white').value) || 0,
    blue_score: Number($('blue').value) || 0,
    comment: $('comment').value || ''
  };
  const result = await sb.from('trainings').insert(payload);
  if (result.error) { msg('❌ ' + result.error.message); return; }
  msg('✅ Тренировка добавлена');
  $('form').reset();
  await load();
};

// ============================================================
// 7. УДАЛЕНИЕ ТРЕНИРОВКИ
// ============================================================
async function delTraining(id) {
  if (!confirm('Удалить тренировку?')) return;
  const result = await sb.from('trainings').delete().eq('id', id);
  if (result.error) { msg('❌ ' + result.error.message); return; }
  msg('Удалено');
  await load();
}

// ============================================================
// 8. РЕДАКТИРОВАНИЕ ИГРОКА
// ============================================================
async function editPlayer(id) {
  const p = players.find(x => x.id === id);
  if (!p) return;
  const h = prompt('Рост, см (пусто — удалить)', p.height_cm ?? '');
  if (h === null) return;
  const w = prompt('Вес, кг (пусто — удалить)', p.weight_kg ?? '');
  if (w === null) return;
  await sb.from('players').update({
    height_cm: h.trim() === '' ? null : Number(h),
    weight_kg: w.trim() === '' ? null : Number(w)
  }).eq('id', id);
  if (!confirm('Изменить фото?')) { await load(); return; }
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async () => {
    if (!input.files[0]) { await load(); return; }
    const file = input.files[0];
    const path = 'players/' + id + '_' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const upload = await sb.storage.from('player-photos').upload(path, file);
    if (upload.error) { msg('❌ ' + upload.error.message); await load(); return; }
    const photo = sb.storage.from('player-photos').getPublicUrl(path).data.publicUrl;
    await sb.from('players').update({ photo_url: photo }).eq('id', id);
    msg('✅ Профиль обновлён');
    await load();
  };
  input.click();
}

// ============================================================
// 9. МЕДИА
// ============================================================
$('mediaForm').onsubmit = async e => {
  e.preventDefault();
  const fileInput = $('mediaFile');
  const caption = $('mediaCaption').value || '';
  if (!fileInput.files || !fileInput.files[0]) { msg('Выберите файл'); return; }
  const file = fileInput.files[0];
  const path = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const upload = await sb.storage.from('club-media').upload(path, file);
  if (upload.error) { msg('❌ ' + upload.error.message); return; }
  const url = sb.storage.from('club-media').getPublicUrl(path).data.publicUrl;
  const insert = await sb.from('media').insert({ url, caption, type: file.type.startsWith('video') ? 'video' : 'image' });
  if (insert.error) { msg('❌ ' + insert.error.message); return; }
  msg('✅ Медиа добавлено');
  $('mediaForm').reset();
  await load();
};

// ============================================================
// 10. ТУРНИРЫ
// ============================================================
$('tourForm').onsubmit = async e => {
  e.preventDefault();
  const name = $('tn').value.trim();
  const date = $('td').value;
  const opponent = $('to').value.trim();
  const score = $('ts').value.trim();
  if (!name || !date) { msg('Заполните название и дату'); return; }
  const result = await sb.from('tournaments').insert({ name, date, opponent, score });
  if (result.error) { msg('❌ ' + result.error.message); return; }
  msg('✅ Турнир добавлен');
  $('tourForm').reset();
  await load();
};

async function setMVP(id) {
  const list = players.map(p => `№${p.number} — ${p.name}`).join('\n');
  const number = prompt('Введите номер MVP:\n\n' + list);
  if (number === null) return;
  const player = players.find(p => String(p.number) === String(number).trim());
  if (!player) { msg('Игрок не найден'); return; }
  const result = await sb.from('tournaments').update({ mvp_player_id: player.id }).eq('id', id);
  if (result.error) { msg('❌ ' + result.error.message); return; }
  msg('✅ MVP назначен');
  await load();
}

// ============================================================
// 11. РЕНДЕРИНГ
// ============================================================
function render() {
  $('recent').innerHTML = trainings.length
    ? `<div class="table-wrap"><table><tr><th>Дата</th><th>Лучший</th><th>Счёт</th></tr>${trainings.slice(0,6).map(t => `<tr><td>${fmt(t.date)}</td><td>${t.best_name || '—'}</td><td>${t.white_score}:${t.blue_score}</td></tr>`).join('')}</table></div>`
    : 'Нет тренировок';
  $('trainings').innerHTML = trainings.length
    ? `<div class="table-wrap"><table><tr><th>Дата</th><th>Лучший</th><th>Помощник</th><th>Счёт</th><th>Победитель</th><th>Комментарий</th><th>Действия</th></tr>${trainings.map(t => `<tr><td>${fmt(t.date)}</td><td>${t.best_name || '—'}</td><td>${t.helper_name || '—'}</td><td>${t.white_score}:${t.blue_score}</td><td><span class="badge">${t.white_score > t.blue_score ? 'Белые' : t.blue_score > t.white_score ? 'Синие' : 'Ничья'}</span></td><td>${t.comment || '—'}</td><td><button class="small" onclick="delTraining('${t.id}')">✕</button></td></tr>`).join('')}</table></div>`
    : 'Нет тренировок';

  const stats = players.map(p => {
    const bestCount = trainings.filter(t => t.best_player_id === p.id).length;
    const helperCount = trainings.filter(t => t.helper_player_id === p.id).length;
    const luckyCount = trainings.filter(t => t.best_player_id === p.id && t.helper_player_id === p.id).length;
    return { ...p, bestCount, helperCount, luckyCount };
  }).sort((a, b) => (b.bestCount + b.helperCount + b.luckyCount) - (a.bestCount + a.helperCount + a.luckyCount));

  $('statTable').innerHTML = `
    <div class="table-wrap">
    <table>
      <tr><th>№</th><th>Игрок</th><th>Лучший</th><th>Помощник</th><th>Счастливчик</th></tr>
      ${stats.map(p => `
        <tr>
          <td>${p.number}</td>
          <td>${p.name}</td>
          <td><b>${p.bestCount}</b></td>
          <td><b>${p.helperCount}</b></td>
          <td>${p.luckyCount ? `<span class="badge gold">${p.luckyCount}</span>` : '0'}</td>
        </tr>
      `).join('')}
    </table>
    </div>
  `;
}

function renderRoster() {
  $('roster').innerHTML = players.map(p => `
    <div style="background:var(--card2);padding:8px;border-radius:8px;border:1px solid var(--border);transition:background 0.25s">
      <img class="avatar" src="${p.photo_url || ''}" onerror="this.style.display='none'">
      <div><b>№${p.number}</b> ${p.name}</div>
      <div style="font-size:calc(var(--font-size) - 4px);color:var(--muted);margin:4px 0">
        Рост: ${p.height_cm ? p.height_cm + ' см' : '—'} | Вес: ${p.weight_kg ? p.weight_kg + ' кг' : '—'}
      </div>
      <button class="small" onclick="editPlayer('${p.id}')">Изменить</button>
    </div>
  `).join('');
}

function renderMedia() {
  $('mediaGrid').innerHTML = media.length
    ? media.map(m => m.type === 'video'
      ? `<video src="${m.url}" controls style="width:100%;border-radius:8px;aspect-ratio:1;object-fit:cover;"></video>`
      : `<img src="${m.url}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;" alt="${m.caption || 'Фото'}">`
    ).join('')
    : 'Нет медиа';
}

function renderTours() {
  $('tourTable').innerHTML = tournaments.length
    ? `<div class="table-wrap"><table><tr><th>Название</th><th>Дата</th><th>Соперник</th><th>Счёт</th><th>MVP</th><th>Действия</th></tr>${tournaments.map(t => `<tr><td>${t.name}</td><td>${fmt(t.date)}</td><td>${t.opponent || '—'}</td><td>${t.score || '—'}</td><td>${t.mvp_name || '—'}</td><td><button class="small" onclick="setMVP('${t.id}')">${t.mvp_name ? 'Изменить MVP' : 'Назначить MVP'}</button></td></tr>`).join('')}</table></div>`
    : 'Нет турниров';
}

// ============================================================
// 12. ЗАПУСК
// ============================================================
nav();
$('date').value = new Date().toISOString().slice(0, 10);
$('td').value = new Date().toISOString().slice(0, 10);
load();
</script>
</body>
</html>
